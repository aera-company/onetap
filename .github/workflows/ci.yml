name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

      # O build roda sem Supabase de propósito: garante que a aplicação sobe
      # sem as variáveis de ambiente, como no desenvolvimento local.
      - run: npm run build

      # Sobe o build e confere as rotas. Um erro de renderização em produção
      # não aparece em typecheck, lint nem no build.
      - run: npm run smoke
